spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  flyway:
    enabled: true

nestearth:
  seed:
    enabled: false
  storage:
    provider: ${STORAGE_PROVIDER:s3}
  messaging:
    provider: firebase

logging:
  level:
    com.nestearth: INFO
    org.springframework.security: WARN
