spring:
  datasource:
    url: jdbc:h2:mem:nestearth_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

nestearth:
  seed:
    enabled: false
  storage:
    provider: local
  messaging:
    provider: log

logging:
  level:
    com.project.rentmebarwaha: WARN

